name: Query Amino Base 400 reviews

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  query-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query SQLite database
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import re
          import sqlite3
          from datetime import datetime
          from pathlib import Path

          START = datetime(2026, 4, 1)
          END = datetime(2026, 5, 1)
          TERMS = ["amino", "base", "400"]

          def norm(s):
              return str(s or "").strip()

          def parse_date(value):
              text = norm(value)
              if not text:
                  return None
              patterns = [
                  "%d.%m.%Y", "%d.%m.%Y %H:%M:%S", "%d.%m.%Y %H:%M",
                  "%Y-%m-%d", "%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S",
                  "%m/%d/%Y", "%m/%d/%Y %H:%M:%S",
              ]
              for p in patterns:
                  try:
                      return datetime.strptime(text[:len(datetime.now().strftime(p))], p)
                  except Exception:
                      pass
              m = re.search(r"(\d{2})\.(\d{2})\.(\d{4})", text)
              if m:
                  return datetime(int(m.group(3)), int(m.group(2)), int(m.group(1)))
              m = re.search(r"(\d{4})-(\d{2})-(\d{2})", text)
              if m:
                  return datetime(int(m.group(1)), int(m.group(2)), int(m.group(3)))
              return None

          def is_date_col(name):
              n = name.lower()
              return any(x in n for x in ["date", "data", "дата", "created", "published"])

          def is_review_table_or_col(table, cols):
              text = (table + " " + " ".join(cols)).lower()
              return any(x in text for x in ["review", "reviews", "отзыв", "otzyv", "feedback", "rating", "оценк", "reit"])

          def product_match(row_text):
              low = row_text.lower()
              return all(t in low for t in TERMS)

          dbs = sorted([p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in {'.sqlite', '.db', '.sqlite3'}])
          print('DB_FILES_FOUND=' + json.dumps([str(p) for p in dbs], ensure_ascii=False))
          all_matches = []
          table_summary = []

          for db in dbs:
              conn = sqlite3.connect(db)
              conn.row_factory = sqlite3.Row
              tables = [r[0] for r in conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name").fetchall()]
              print(f'DB={db}; TABLES={len(tables)}')
              for table in tables:
                  cols = [r[1] for r in conn.execute(f'PRAGMA table_info("{table}")').fetchall()]
                  if not cols:
                      continue
                  cnt = conn.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                  table_summary.append({"db": str(db), "table": table, "rows": cnt, "cols": cols})
                  date_cols = [c for c in cols if is_date_col(c)]
                  if not date_cols:
                      continue

                  # Pull only rows where any column contains Amino/Base/400 separately when possible.
                  # For reliability on mixed schemas, scan table rows in Python.
                  for row in conn.execute(f'SELECT rowid AS __rowid__, * FROM "{table}"'):
                      row_dict = dict(row)
                      row_text = " | ".join(norm(v) for k, v in row_dict.items() if k != "__rowid__")
                      if not product_match(row_text):
                          continue
                      dates = [parse_date(row_dict.get(c)) for c in date_cols]
                      dates = [d for d in dates if d]
                      if not dates:
                          continue
                      if not any(START <= d <= END for d in dates):
                          continue
                      if not is_review_table_or_col(table, cols):
                          # Keep as possible match, but mark it.
                          kind = "possible_non_review_table"
                      else:
                          kind = "review_match"
                      all_matches.append({
                          "kind": kind,
                          "db": str(db),
                          "table": table,
                          "rowid": row_dict.get("__rowid__"),
                          "date": next((d.strftime('%Y-%m-%d') for d in dates if START <= d <= END), None),
                          "row": {k: v for k, v in row_dict.items() if k != "__rowid__"},
                      })
              conn.close()

          print('TABLE_SUMMARY_START')
          print(json.dumps(table_summary, ensure_ascii=False, indent=2)[:60000])
          print('TABLE_SUMMARY_END')

          review_matches = [m for m in all_matches if m['kind'] == 'review_match']
          possible_matches = [m for m in all_matches if m['kind'] != 'review_match']

          print('MATCHES_COUNT=' + json.dumps({"review_matches": len(review_matches), "possible_matches": len(possible_matches)}, ensure_ascii=False))
          print('REVIEW_MATCHES_JSON_START')
          print(json.dumps(review_matches, ensure_ascii=False, indent=2)[:120000])
          print('REVIEW_MATCHES_JSON_END')
          print('POSSIBLE_MATCHES_JSON_START')
          print(json.dumps(possible_matches, ensure_ascii=False, indent=2)[:120000])
          print('POSSIBLE_MATCHES_JSON_END')
          PY
