<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Остатки маркетплейсов{% endblock %}</title>
  <style>
    :root {font-family: Arial,sans-serif;color:#202124;background:#f6f7f9} body{margin:0}.wrap{max-width:1280px;margin:auto;padding:24px}
    a{color:#155eef;text-decoration:none}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px}
    .metric{font-size:28px;font-weight:700}.muted{color:#667085}.ok{color:#067647}.bad{color:#b42318}.table-wrap{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:12px}
    table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}th{background:#f9fafb;position:sticky;top:0}
    input,select,button{padding:9px 12px;border:1px solid #ccc;border-radius:8px;background:#fff}button{cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav{background:#fff;border-bottom:1px solid #ddd}.nav .wrap{padding-top:14px;padding-bottom:14px}
  </style>
</head>
<body><div class="nav"><div class="wrap"><a href="/"><strong>Marketplace Stock History</strong></a></div></div><main class="wrap">{% block content %}{% endblock %}</main></body>
</html>
